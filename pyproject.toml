[project]
name = "robot-data-engineering"
version = "0.1.0"
description = "Robot data engineering: analysis, conversion, evaluation, and training pipelines for embodied AI"
requires-python = ">=3.12"
dependencies = [
    "lerobot>=0.6.0",
    "torch>=2.7.0",
    "h5py>=3.10.0",
    "pyarrow>=14.0.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scipy>=1.11.0",
    "wandb>=0.16.0",
    "tqdm>=4.66.0",
    "imageio[ffmpeg]>=2.33.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
]
convert = [
    "rosbags>=0.9.0",
    "mcap>=1.1.0",
    "mcap-ros2-support>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["data", "convert", "eval", "train"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
